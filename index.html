<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9efdd"><title>花月汀 · 小狼的四季鱼笺</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/sailing.css">
</head>
<body>
<div id="game">
 <div id="world" aria-label="三维钓鱼场景"><div id="loading">正在把小船推入水中<span>准备三维湖面与小狼…</span></div></div>
 <div class="vignette" aria-hidden="true"></div>
 <header class="topbar">
  <div class="dial-wrap">
   <button id="minimap" type="button" aria-label="打开水域地图，北在上"><span id="minimapBase" aria-hidden="true"></span><span class="compass-north" aria-hidden="true">北</span><i id="minimapMarker" aria-hidden="true"></i></button>
   <button id="dial" type="button" aria-label="花月盘" aria-describedby="dialHelp"><i class="season-symbol" aria-hidden="true"></i></button><span id="dialReadout" role="status" hidden></span><span id="dialHelp" class="sr-only">轻点查看，长按或按下方向键进入调节</span></div>
  <div class="top-actions"><output class="wallet" aria-label="花月币余额"><span class="coin" aria-hidden="true">✦</span><strong id="coins"></strong></output></div>
 </header>
 <div id="waypoint" class="waypoint" hidden><span class="waypoint-arrow" aria-hidden="true"></span><span id="waypointName"></span><span id="waypointDistance"></span><button id="cancelWaypoint" type="button" aria-label="取消目的地追踪" title="取消追踪">×</button></div>
 <section class="location-block" aria-label="当前地点">
  <h1 id="locationName"></h1><p id="locationTag"></p>
 </section>
 <nav class="side-nav" aria-label="游戏菜单">
  <button data-open="bag" class="nav-item bag-button" title="背包" aria-label="背包"><i aria-hidden="true"></i></button>
  <button data-open="shop" class="nav-item quick-icon" title="渔具铺" aria-label="渔具铺"><span class="css-icon shop-icon" aria-hidden="true"></span></button>
  <button data-open="book" class="nav-item quick-icon" title="鱼笺图鉴" aria-label="鱼笺图鉴"><span class="css-icon book-icon" aria-hidden="true"></span></button>
  <button data-open="clock" class="nav-item quick-icon" title="设置" aria-label="设置"><span aria-hidden="true">⚙</span></button>
  <button id="boatBtn" class="dock-action" hidden></button>
 </nav>
 <div id="joystick" aria-hidden="true" hidden><i></i></div>
 <section class="fishing-hud" aria-label="钓鱼操作">
  <button data-open="rod" class="gear-icon rod-icon" aria-label="换鱼竿" title="换鱼竿"><i aria-hidden="true"></i></button>
  <div class="main-fishing"><div class="fishing-message" id="fishingMessage" role="status" aria-live="polite"></div>
   <div id="reelPanel" hidden><div class="reel-labels"><span>跟着鱼，轻轻收线</span><span id="reelPercent">0%</span></div><div class="tension-track"><div id="safeZone"></div><div id="tensionMarker"></div></div><div class="reel-progress"><i id="reelProgress"></i></div><small>按住收线，松开缓一缓</small></div>
   <button id="castBtn" class="cast-button" disabled><span id="castLabel">抛一竿</span></button>
  </div>
  <button data-open="bait" class="gear-icon bait-icon" aria-label="换鱼饵" title="换鱼饵"><i aria-hidden="true"></i></button>
 </section>
 <div id="toast" class="toast" role="status" hidden></div>
</div>
<dialog id="panel" class="panel-dialog"><button id="closePanel" class="close-button" aria-label="关闭">×</button><nav id="bagTabs" aria-label="背包分类" hidden><button data-tab="book">鱼笺册</button><button data-tab="shop">渔具铺</button><button data-tab="rod">鱼竿</button><button data-tab="bait">鱼饵</button><button data-tab="clock">设置</button></nav><div id="panelContent"></div></dialog>
<dialog id="catchDialog" class="catch-dialog"><p class="eyebrow" id="catchEyebrow">今天的第一份小惊喜</p><canvas id="catchArt" width="480" height="240" aria-label="捕获鱼的图鉴插画"></canvas><div id="catchStars" class="stars"></div><h2 id="catchName"></h2><p id="catchDetail"></p><p id="catchNote" class="fish-note"></p><div class="catch-actions"><button id="releaseBtn" class="primary">记下它，再放归湖里 <small id="releaseValue"></small></button><button id="sellBtn" class="secondary">带去渔具铺 <small id="sellValue"></small></button></div><small class="catch-footnote">两种选择都会记录鱼笺，放归也能获得观察酬金。</small></dialog>
<script type="module" src="src/main.js"></script>
</body>
</html>
